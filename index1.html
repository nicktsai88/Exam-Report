<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會考模考健檢系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        /* 自訂淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        /* 列印時隱藏不需要的元素 */
        @media print {
            .print-hidden { display: none !important; }
            body { background: white !important; }
            .print-bg-white { background: white !important; padding: 0 !important; }
            .print-shadow-none { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-[#f3f2eb] text-gray-800 min-h-screen pb-20">

    <!-- 頂部導覽列 -->
    <header class="bg-[#1a362d] text-[#f3f2eb] p-4 flex justify-between items-center shadow-md print-hidden">
        <div class="flex items-center gap-2">
            <i data-lucide="star" class="text-[#eab308] fill-current w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-wider">會考模考健檢系統</h1>
        </div>
        <button id="btn-settings" class="text-sm flex items-center gap-1 hover:text-[#eab308] transition hidden">
            <i data-lucide="settings" class="w-4 h-4"></i> API 設定
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 sm:p-6 print-bg-white">

        <!-- ================= Step 0: API Key 設定 ================= -->
        <section id="step-0" class="hidden animate-fade-in">
            <div class="bg-white rounded-3xl p-6 shadow-lg mt-10 border border-gray-100">
                <div class="flex justify-center mb-6">
                    <div class="w-16 h-16 bg-[#1a362d] rounded-full flex items-center justify-center">
                        <i data-lucide="settings" class="text-[#eab308] w-8 h-8"></i>
                    </div>
                </div>
                <h2 class="text-2xl font-bold text-center text-[#1a362d] mb-2">系統初始設定</h2>
                <p class="text-sm text-gray-500 text-center mb-6">請輸入您的 Google Gemini API Key 以啟用 AI 辨識功能。金鑰將安全地儲存在您的瀏覽器中。</p>
                <input 
                    type="password" 
                    id="input-api-key"
                    placeholder="AIzaSy..."
                    class="w-full p-3 bg-[#f3f2eb] rounded-xl mb-4 focus:ring-2 focus:ring-[#6b46c1] outline-none"
                />
                <button 
                    onclick="saveApiKey()"
                    class="w-full bg-[#1a362d] text-white py-3 rounded-xl font-bold hover:bg-opacity-90 transition shadow-md"
                >
                    儲存並開始使用
                </button>
            </div>
        </section>

        <!-- ================= Step 1: 考試資訊 ================= -->
        <section id="step-1" class="hidden animate-fade-in mt-6 space-y-6">
            <div>
                <h2 class="text-3xl font-bold text-[#1a362d] mb-1">建立新健檢</h2>
                <p class="text-gray-500 text-sm">請輸入這次模擬考的基本資訊</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm space-y-4 border border-gray-100">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">模擬考名稱</label>
                    <input 
                        type="text" 
                        id="input-exam-name"
                        placeholder="例如：113學年度第一次基北區模考"
                        class="w-full p-3 bg-[#f3f2eb] rounded-xl focus:ring-2 focus:ring-[#6b46c1] outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">試卷編號 (選填)</label>
                    <input 
                        type="text" 
                        id="input-exam-id"
                        placeholder="例如：M-113-01"
                        class="w-full p-3 bg-[#f3f2eb] rounded-xl focus:ring-2 focus:ring-[#6b46c1] outline-none"
                    />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">健檢科目</label>
                    <select id="input-exam-subject" class="w-full p-3 bg-[#f3f2eb] rounded-xl focus:ring-2 focus:ring-[#6b46c1] outline-none font-bold text-[#1a362d]">
                        <option value="國文">國文</option>
                        <option value="英文">英文</option>
                        <option value="數學" selected>數學</option>
                        <option value="自然">自然</option>
                        <option value="社會">社會</option>
                    </select>
                </div>
            </div>
            <button 
                id="btn-to-step2"
                onclick="setStep(2)"
                disabled
                class="w-full bg-[#1a362d] text-white py-4 rounded-2xl font-bold text-lg disabled:opacity-50 hover:bg-opacity-90 flex justify-center items-center gap-2 shadow-lg transition"
            >
                下一步：上傳試卷 <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </section>

        <!-- ================= Step 2: 上傳考卷與解答 ================= -->
        <section id="step-2" class="hidden animate-fade-in mt-6 space-y-6">
            <div class="flex items-center gap-2 mb-4">
                <button onclick="setStep(1)" class="text-gray-500 font-bold hover:text-gray-800">← 返回</button>
            </div>
            <div>
                <h2 class="text-3xl font-bold text-[#1a362d] mb-1">上傳作答資料</h2>
                <p class="text-gray-500 text-sm">請拍攝清晰的作答卷與正確解答</p>
            </div>

            <!-- 學生作答上傳 -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-lg text-[#1a362d] mb-3 flex items-center gap-2">
                    <span class="bg-[#6b46c1] text-white w-6 h-6 rounded-full flex justify-center items-center text-xs">1</span>
                    學生的作答卷
                </h3>
                <label class="cursor-pointer block relative">
                    <div id="preview-student" class="border-2 border-dashed border-[#1a362d] border-opacity-30 rounded-2xl h-40 flex flex-col items-center justify-center bg-[#f3f2eb] hover:bg-gray-100 transition relative overflow-hidden bg-cover bg-center">
                        <div id="placeholder-student" class="flex flex-col items-center z-10">
                            <i data-lucide="camera" class="w-8 h-8 text-[#1a362d] mb-2"></i>
                            <span class="text-sm font-bold text-gray-600 bg-white/70 px-2 py-1 rounded">點擊拍照或上傳圖片</span>
                        </div>
                    </div>
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload('student', event)" />
                </label>
            </div>

            <!-- 正確解答上傳 -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-lg text-[#1a362d] mb-3 flex items-center gap-2">
                    <span class="bg-[#6b46c1] text-white w-6 h-6 rounded-full flex justify-center items-center text-xs">2</span>
                    正確解答卡 (詳解)
                </h3>
                <label class="cursor-pointer block relative">
                    <div id="preview-answer" class="border-2 border-dashed border-[#1a362d] border-opacity-30 rounded-2xl h-40 flex flex-col items-center justify-center bg-[#f3f2eb] hover:bg-gray-100 transition relative overflow-hidden bg-cover bg-center">
                        <div id="placeholder-answer" class="flex flex-col items-center z-10">
                            <i data-lucide="upload" class="w-8 h-8 text-[#1a362d] mb-2"></i>
                            <span class="text-sm font-bold text-gray-600 bg-white/70 px-2 py-1 rounded">點擊上傳標準答案</span>
                        </div>
                    </div>
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload('answer', event)" />
                </label>
            </div>

            <button 
                id="btn-start-analysis"
                onclick="startAnalysis()"
                disabled
                class="w-full bg-[#1a362d] text-white py-4 rounded-2xl font-bold text-lg disabled:opacity-50 hover:bg-opacity-90 shadow-lg mt-4 transition"
            >
                開始 AI 健檢分析
            </button>
        </section>

        <!-- ================= Step 3: 載入動畫 (全螢幕) ================= -->
        <section id="step-3" class="hidden fixed inset-0 bg-[#1a362d] z-50 flex flex-col items-center justify-center p-6">
            <div class="relative w-32 h-32 mb-12">
                <div class="absolute inset-0 border border-[#eab308] border-opacity-30 rounded-full animate-[spin_4s_linear_infinite]"></div>
                <div class="absolute inset-2 border border-white border-opacity-10 rounded-full animate-[spin_3s_linear_infinite_reverse]"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i data-lucide="star" class="text-[#eab308] w-12 h-12 animate-pulse fill-current"></i>
                </div>
                <!-- 軌道上的小點 -->
                <div class="absolute top-0 left-1/2 w-2 h-2 bg-[#eab308] rounded-full -ml-1 -mt-1 animate-ping"></div>
                <div class="absolute bottom-4 right-4 w-1.5 h-1.5 bg-[#eab308] rounded-full opacity-50"></div>
            </div>

            <div class="text-[#eab308] text-sm font-bold tracking-widest mb-4">健檢計算中</div>
            <h2 id="loading-title" class="text-white text-3xl font-serif font-bold mb-4 text-center tracking-wide min-h-[40px] transition-all duration-300">正在整合作答結果</h2>
            <p id="loading-desc" class="text-gray-300 text-center text-sm max-w-[280px] min-h-[40px] opacity-80 leading-relaxed transition-all duration-300">核對每題作答與未作答題目，確認健檢資料完整。</p>

            <!-- 進度條 -->
            <div class="w-full max-w-xs h-1.5 bg-white bg-opacity-10 rounded-full mt-12 mb-4 overflow-hidden relative">
                <div id="loading-progress" class="absolute top-0 left-0 h-full w-1/3 bg-gradient-to-r from-[#eab308] to-orange-400 transition-all duration-1000 ease-out"></div>
            </div>
            <div class="text-gray-400 text-xs">請稍候一下，完成後會自動帶你到結果區。</div>
        </section>

        <!-- ================= Step 4: 核對題目與答案 ================= -->
        <section id="step-4" class="hidden animate-fade-in space-y-4">
            <div class="sticky top-0 bg-[#f3f2eb] py-4 z-10 border-b border-gray-200">
               <h2 class="text-2xl font-bold text-[#1a362d]">確認 AI 辨識結果</h2>
               <p class="text-sm text-gray-500">請核對每題作答，若有誤判請點擊更改。</p>
            </div>
            
            <div id="verification-list" class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100 divide-y divide-gray-100">
                <!-- 內容由 JS 動態生成 -->
            </div>

            <button 
                onclick="generateReport()"
                class="w-full bg-[#1a362d] text-white py-4 rounded-2xl font-bold text-lg hover:bg-opacity-90 shadow-lg sticky bottom-4 transition"
            >
                產生專屬健檢報告
            </button>
        </section>

        <!-- ================= Step 5: 健檢報告 (動態生成) ================= -->
        <section id="step-5" class="hidden animate-fade-in space-y-6 print-bg-white print:space-y-4">
            <!-- 報告內容將由 JS 根據 AI 分析結果動態注入 -->
        </section>
    </main>

    <!-- ================= JavaScript 邏輯 ================= -->
    <script>
        // 狀態管理
        let currentStep = 0;
        let images = { student: null, answer: null };
        let syllabusData = null; // 用來存放從外部讀取的學習內容
        let extractedData = []; // 存放真實 AI 分析結果
        let loadingInterval; // 載入動畫計時器

        // 常數：API 模型 (支援多模態圖片分析與 JSON 輸出)
        const API_MODEL = "gemini-2.5-flash-preview-09-2025";

        // 載入外部學習內容 (data.json)
        async function loadSyllabusData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('讀取 data.json 失敗');
                syllabusData = await response.json();
                console.log('✅ 成功載入核心觀念資料庫:', syllabusData);
            } catch (error) {
                console.warn('⚠️ 無法載入 data.json。請確認使用 Live Server 執行以避免 CORS 限制。', error);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadSyllabusData();
            
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('input-api-key').value = savedKey;
                document.getElementById('btn-settings').classList.remove('hidden');
                setStep(1);
            } else {
                setStep(0);
            }

            document.getElementById('input-exam-name').addEventListener('input', validateStep1);
            document.getElementById('btn-settings').addEventListener('click', () => setStep(0));
        });

        function saveApiKey() {
            const key = document.getElementById('input-api-key').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('btn-settings').classList.remove('hidden');
                setStep(1);
            } else {
                alert('請輸入有效的 API Key');
            }
        }

        function setStep(step) {
            currentStep = step;
            for (let i = 0; i <= 5; i++) {
                const el = document.getElementById(`step-${i}`);
                if (el) el.classList.add('hidden');
            }
            const targetEl = document.getElementById(`step-${step}`);
            if (targetEl) targetEl.classList.remove('hidden');
            
            if (step === 4) renderVerificationList();
            // 每次切換畫面重新渲染圖示
            setTimeout(() => lucide.createIcons(), 50); 
        }

        function validateStep1() {
            const name = document.getElementById('input-exam-name').value.trim();
            const btn = document.getElementById('btn-to-step2');
            if (name.length > 0) {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50');
            }
        }

        function handleImageUpload(type, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    images[type] = e.target.result;
                    const previewDiv = document.getElementById(`preview-${type}`);
                    previewDiv.style.backgroundImage = `linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), url('${e.target.result}')`;
                    checkStep2Ready();
                }
                reader.readAsDataURL(file);
            }
        }

        function checkStep2Ready() {
            const btn = document.getElementById('btn-start-analysis');
            if (images.student && images.answer) {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        // Helper: 指數退避重試機制
        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(JSON.stringify(errorData));
                    }
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    console.warn(`API 呼叫失敗，將於 ${delays[i]} 毫秒後進行第 ${i + 1} 次重試...`, err);
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        // Helper: 取得 Base64 與 MimeType
        const getBase64 = (dataUrl) => dataUrl.split(',')[1];
        const getMimeType = (dataUrl) => dataUrl.split(';')[0].split(':')[1];

        // 動態載入動畫控制
        function startLoadingAnimation() {
            setStep(3);
            const titles = ["正在上傳作答影像", "AI 正在比對答案", "正在計算弱點權重", "正在彙整分析報告"];
            const descs = [
                "正在將考卷與解答影像安全傳送至 AI 進行解析...",
                "正在運用視覺模型逐題比對您的作答與標準答案...",
                "依錯題、章節涵蓋與證據量，比對課綱核心觀念...",
                "即將完成，請稍候一下..."
            ];
            
            let progress = 0;
            let phase = 0;
            const progressEl = document.getElementById('loading-progress');
            
            loadingInterval = setInterval(() => {
                progress += Math.random() * 4; // 隨機增加進度
                if (progress > 95) progress = 95; // 卡在 95% 等待 API 回應
                progressEl.style.width = `${progress}%`;

                if (progress > 25 && phase === 0) phase = 1;
                if (progress > 50 && phase === 1) phase = 2;
                if (progress > 75 && phase === 2) phase = 3;

                document.getElementById('loading-title').textContent = titles[phase];
                document.getElementById('loading-desc').textContent = descs[phase];
            }, 500);
        }

        function stopLoadingAnimation() {
            clearInterval(loadingInterval);
            document.getElementById('loading-progress').style.width = '100%';
        }

        // 真實進行 AI 分析
        async function startAnalysis() {
            const apiKey = document.getElementById('input-api-key').value.trim();
            const subject = document.getElementById('input-exam-subject').value;
            const subjectData = syllabusData ? syllabusData[subject] : {};

            startLoadingAnimation();

            try {
                const prompt = `
                    你是一位專業的閱卷老師。我提供了兩張圖片：
                    第一張是學生的作答卷。
                    第二張是正確解答卡（詳解）。
                    請比對這兩張圖片，找出所有的題目，並核對學生的作答是否正確。
                    科目是：${subject}。
                    請參考以下該科目的核心觀念 JSON 結構：
                    ${JSON.stringify(subjectData)}

                    請分析每一題，並根據 JSON 格式回傳結果。如果圖片模糊，請盡力辨識並降低 confidence 分數。
                    必須包含所有辨識到的題號。
                `;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${apiKey}`;
                
                // 強制要求結構化 JSON 回傳
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: getMimeType(images.student), data: getBase64(images.student) } },
                            { inlineData: { mimeType: getMimeType(images.answer), data: getBase64(images.answer) } }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                results: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            id: { type: "INTEGER", description: "題號" },
                                            userAns: { type: "STRING", description: "學生作答 (A/B/C/D 或 未作答)" },
                                            correctAns: { type: "STRING", description: "正確答案" },
                                            isCorrect: { type: "BOOLEAN" },
                                            confidence: { type: "INTEGER", description: "辨識信心 0-100" },
                                            topic: { type: "STRING", description: "對應的主單元名稱" },
                                            subTopic: { type: "STRING", description: "對應的子觀念名稱" },
                                            goal: { type: "STRING", description: "學習目標 (簡短一句話)" },
                                            scorePenalty: { type: "NUMBER", description: "答錯扣分 (預設可給 3.4 或依題數推算)" }
                                        },
                                        required: ["id", "userAns", "correctAns", "isCorrect", "confidence", "topic", "subTopic", "goal", "scorePenalty"]
                                    }
                                }
                            }
                        }
                    }
                };

                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                stopLoadingAnimation();
                
                const responseText = result.candidates[0].content.parts[0].text;
                const parsedData = JSON.parse(responseText);
                
                extractedData = parsedData.results.sort((a, b) => a.id - b.id);
                
                if (extractedData.length === 0) throw new Error("未能辨識出任何題目。");
                
                setStep(4);

            } catch (error) {
                stopLoadingAnimation();
                console.error(error);
                alert("AI 分析失敗，請確認您的圖片是否夠清晰，或檢查 API Key 額度。\n錯誤細節：" + error.message);
                setStep(2); 
            }
        }

        // 渲染 Step 4 列表
        function renderVerificationList() {
            const listContainer = document.getElementById('verification-list');
            let htmlContent = '';

            extractedData.forEach(item => {
                const iconColor = item.confidence >= 90 ? 'text-green-500' : 'text-[#eab308]';
                const iconName = item.confidence >= 90 ? 'check-circle' : 'alert-circle';
                
                htmlContent += `
                    <div class="flex items-center p-4 hover:bg-gray-50 transition">
                        <div class="w-12 text-center">
                            <span class="block text-lg font-bold text-[#1a362d]">${item.id}</span>
                            <span class="text-[10px] text-gray-400">答案卷</span>
                        </div>
                        
                        <div class="flex-1 flex justify-center text-2xl font-bold font-serif text-[#1a362d] ${item.isCorrect ? '' : 'text-red-600'}">
                            ${item.userAns}
                        </div>
                        
                        <div class="flex-1 text-center">
                            <span class="text-sm font-bold text-[#1a362d] flex items-center justify-center gap-1">
                                <i data-lucide="${iconName}" class="w-3 h-3 ${iconColor}"></i>
                                ${item.confidence >= 90 ? 'AI 已帶入' : '需人工確認'}
                            </span>
                            <span class="text-[10px] text-gray-400">AI 信心 ${item.confidence}%</span>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = htmlContent;
        }

        // 動態生成 Step 5 健檢報告
        function generateReport() {
            const container = document.getElementById('step-5');
            const subject = document.getElementById('input-exam-subject').value;
            
            // 計算錯題與分數
            const wrongQuestions = extractedData.filter(q => !q.isCorrect);
            const totalPenalty = wrongQuestions.reduce((sum, q) => sum + (q.scorePenalty || 0), 0);
            let finalScore = (100 - totalPenalty).toFixed(2);
            if (finalScore < 0) finalScore = 0;
            
            let grade = 'C';
            if(finalScore >= 80) grade = 'A';
            else if(finalScore >= 60) grade = 'B';

            // 統計章節分佈
            const topicCounts = {};
            wrongQuestions.forEach(q => {
                topicCounts[q.topic] = (topicCounts[q.topic] || 0) + 1;
            });
            const totalWrongs = wrongQuestions.length;
            
            // 生成圓餅圖圖例與比例
            const colors = ['#6b46c1', '#8b5cf6', '#a78bfa', '#c4b5fd', '#eab308'];
            let topicDistributionHtml = '';
            let gradientStops = [];
            let currentPercent = 0;
            
            let colorIndex = 0;
            for (const [topic, count] of Object.entries(topicCounts)) {
                const percent = ((count / totalWrongs) * 100).toFixed(2);
                const color = colors[colorIndex % colors.length];
                
                gradientStops.push(`${color} ${currentPercent}% ${currentPercent + parseFloat(percent)}%`);
                currentPercent += parseFloat(percent);
                
                topicDistributionHtml += `
                    <div class="bg-[#f8f9fa] p-4 rounded-2xl flex justify-between items-center border border-gray-100">
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: ${color};"></div>
                            <div>
                                <div class="font-bold text-[#1a362d] text-sm">${topic}</div>
                                <div class="text-xs text-gray-400">${count} 題</div>
                            </div>
                        </div>
                        <div class="font-bold text-lg text-[#1a362d]">${percent}%</div>
                    </div>
                `;
                colorIndex++;
            }
            
            const conicGradient = gradientStops.length > 0 ? `conic-gradient(${gradientStops.join(', ')})` : '#e2e8f0';

            // 錯題標籤
            const wrongTagsHtml = wrongQuestions.map(q => 
                `<span class="bg-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm border border-gray-100 text-gray-700">第 ${q.id} 題</span>`
            ).join('');

            // 錯題評語與學習目標
            const evaluationsHtml = wrongQuestions.map(q => `
                <div class="bg-[#f3f2eb] p-4 rounded-2xl border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-[#1a362d] text-lg">第 ${q.id} 題</span>
                        <span class="bg-[#e9d5ff] text-[#6b46c1] px-2 py-1 rounded-full text-xs font-bold">失 ${(q.scorePenalty || 0).toFixed(2)} 分</span>
                    </div>
                    <div class="font-bold text-[#1a362d] mb-1">${q.subTopic}</div>
                    <div class="text-sm text-gray-600">目標：${q.goal}</div>
                </div>
            `).join('');

            // 優先建議順序 (取前三名最常錯的 subTopic)
            const subTopicCounts = {};
            wrongQuestions.forEach(q => {
                if(!subTopicCounts[q.subTopic]) subTopicCounts[q.subTopic] = { count: 0, details: [] };
                subTopicCounts[q.subTopic].count += 1;
                subTopicCounts[q.subTopic].details.push(q);
            });
            
            const sortedSubTopics = Object.keys(subTopicCounts).sort((a, b) => subTopicCounts[b].count - subTopicCounts[a].count);
            
            const adviceTitles = ["第一順位", "第二順位", "第三順位"];
            let recommendationsHtml = sortedSubTopics.slice(0, 3).map((subTopic, idx) => `
                <div class="bg-[#f3f2eb] p-4 rounded-2xl border border-gray-200">
                    <div class="text-[#6b46c1] font-bold text-sm mb-1">${adviceTitles[idx] || `建議`}</div>
                    <div class="font-bold text-[#1a362d] text-lg mb-2">${subTopic}</div>
                    <p class="text-sm text-gray-600">強烈建議重新複習此單元的核心觀念：${subTopicCounts[subTopic].details[0].goal}。相關錯題：${subTopicCounts[subTopic].details.map(d=>d.id).join(', ')}</p>
                </div>
            `).join('');

            const reviewPathHtml = sortedSubTopics.slice(0, 3).map(s => `<span>${s}</span>`).join(' <span>→</span> ');

            const reportHtml = `
                <div class="bg-[#1a362d] text-white p-6 rounded-[2rem] shadow-lg relative overflow-hidden print-shadow-none print:border print:border-gray-300">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-[#6b46c1] rounded-full blur-3xl opacity-30 -mr-10 -mt-10 print-hidden"></div>
                    <h3 class="text-[#eab308] font-bold text-sm mb-2">快速弱點健檢報告 (${subject})</h3>
                    <div class="flex items-end gap-2 mb-4">
                        <span class="text-6xl font-bold tracking-tighter">${finalScore}</span>
                        <span class="text-xl text-gray-300 pb-2">/ 100 分</span>
                        <span class="text-5xl font-bold text-[#eab308] ml-auto">${grade}</span>
                    </div>
                    <p class="text-xs text-gray-300 leading-relaxed opacity-80">這份結果由 AI 擷取計算，自動為您抓出可能的弱點章節；如需精確分數，仍請以實際紙本批改為準。</p>
                </div>

                <div class="text-center font-bold text-2xl text-[#eab308] stroke-black print-hidden" style="text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;">
                   專屬健檢報告出爐啦！
                </div>

                <div class="space-y-3">
                    <h4 class="text-lg font-bold text-[#1a362d] flex items-center gap-2">
                        <span class="text-sm text-red-700">01</span> 錯題章節分佈
                    </h4>
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col items-center border border-gray-100">
                        <div class="relative w-40 h-40 rounded-full flex items-center justify-center mb-6" style="background: ${conicGradient};">
                            <div class="w-24 h-24 bg-[#f3f2eb] rounded-full flex flex-col items-center justify-center shadow-inner print-bg-white">
                                <span class="text-4xl font-bold text-[#1a362d]">${totalWrongs}</span>
                                <span class="text-[10px] text-gray-500">題錯誤</span>
                            </div>
                        </div>
                        <div class="w-full space-y-3">${topicDistributionHtml}</div>
                    </div>
                </div>

                <div class="space-y-3 print:break-inside-avoid">
                    <h4 class="text-lg font-bold text-[#1a362d] flex items-center gap-2">
                        <span class="text-sm text-red-700">02</span> ${subject} 弱點章節
                    </h4>
                    <div class="bg-[#1a362d] text-white p-5 rounded-t-[2rem] flex justify-between items-center print-bg-white print:text-black print:border print:border-gray-300">
                        <div>
                            <div class="text-xs text-[#eab308] mb-1 print:text-gray-500">失分最多</div>
                            <div class="text-2xl font-bold">${subject}</div>
                        </div>
                        <div class="text-right font-bold">
                            總失分 ${totalPenalty.toFixed(2)} 分 <span class="text-gray-400 text-sm font-normal print:text-gray-500">/ 100 分</span>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-b-[2rem] border-t-4 border-[#6b46c1] shadow-sm -mt-2">
                        <div class="flex justify-between items-center mb-4 text-[#6b46c1] font-bold">
                            <span class="text-sm">${subject}弱點整理</span>
                            <span>失分 ${totalPenalty.toFixed(2)} 分 · ${totalWrongs} 題錯誤</span>
                        </div>
                        <div class="bg-[#fdf8f5] p-4 rounded-2xl border border-orange-100">
                            <div class="text-[#1a362d] font-bold text-sm mb-3">你錯了這些題目</div>
                            <div class="flex flex-wrap gap-2">${wrongTagsHtml || '太棒了！沒有錯題'}</div>
                        </div>
                    </div>
                </div>

                ${totalWrongs > 0 ? `
                <div class="bg-white p-1 rounded-[2rem] border-l-4 border-[#6b46c1] shadow-sm overflow-hidden border border-gray-100 print:break-inside-avoid">
                    <div class="p-5">
                        <div class="text-[#6b46c1] font-bold mb-4">${subject}</div>
                        <h3 class="text-2xl font-black text-[#1a362d] mb-1" style="text-shadow: 1px 1px 0 #eab308;">分析各章節弱點</h3>
                        <p class="text-sm text-gray-500 mb-5">哪些觀念不熟。</p>
                        <div class="space-y-3">${evaluationsHtml}</div>
                    </div>
                </div>

                <div class="bg-white p-1 rounded-[2rem] border-l-4 border-[#6b46c1] shadow-sm overflow-hidden border border-gray-100 print:break-before-page">
                    <div class="p-5">
                        <div class="text-[#6b46c1] font-bold text-lg mb-2 flex items-center gap-2">
                            <span class="text-sm">01</span> ${subject} 優先建議
                        </div>
                        <div class="text-[#6b46c1] font-bold mb-5 flex flex-wrap items-center gap-1 text-sm">
                            ${reviewPathHtml}
                        </div>
                        <div class="space-y-4">
                            ${recommendationsHtml}
                            <div class="bg-[#f3f2eb] p-4 rounded-2xl border-2 border-[#1a362d] border-opacity-10">
                                <div class="text-[#6b46c1] font-bold text-sm mb-1">完成方式</div>
                                <p class="text-sm text-gray-600">閱讀時先把已知條件改寫成式子，再說明每一步使用的性質。讀完後重做本次同章錯題，並用一題不同敘述的題目確認不是只記住解法。</p>
                            </div>
                        </div>
                    </div>
                </div>
                ` : ''}

                <div class="pt-6 pb-10 flex justify-center print-hidden">
                    <button onclick="window.print()" class="bg-white text-[#1a362d] px-8 py-4 rounded-full font-black text-lg shadow-xl hover:shadow-2xl transition flex items-center gap-3 border border-gray-100">
                        收藏我的健檢菜單 <i data-lucide="download" class="w-6 h-6"></i>
                    </button>
                </div>
            `;
            
            container.innerHTML = reportHtml;
            setStep(5);
        }
    </script>
</body>
</html>
